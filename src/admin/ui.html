<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Asaas Mock — painel</title>

<!--
  A Geist é a fonte do Atlas (o design system do Asaas). Carregada de forma NÃO
  bloqueante: o simulador precisa subir num CI sem rede, e um `<link>` normal para
  o Google Fonts congelaria a renderização até o DNS falhar. Com `media="print"`
  a folha entra fora do caminho crítico e a página abre na hora — se a rede não
  existir, a cadeia de fallback assume e o painel continua legível.
-->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  media="print"
  onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&display=swap"
/>

<style>
  /*
   * Sem build step, sem CDN, sem dependência.
   *
   * As cores, raios e espaçamentos abaixo são os tokens SEMÂNTICOS do Atlas
   * (@asaasdev/atlas), o design system do próprio Asaas — reproduzidos aqui à mão
   * porque puxar o pacote inteiro (~1MB, quase todo editor de texto rico e uma
   * fonte de ícones embutida) para uma tela de dev não se paga.
   *
   * A regra que faz isto continuar parecendo Asaas: o CSS abaixo consome os nomes
   * semânticos (--surface-*, --text-*, --border-*), nunca as primitivas de cor
   * diretamente. Trocar o azul é trocar uma linha.
   */
  :root {
    /* primitivas — Persian Blue é o azul do Asaas */
    --blue-50: #d6eaff;  --blue-100: #c7e0ff; --blue-400: #1f61ff;
    --blue-500: #0038e5; --blue-600: #0036b8; --blue-700: #002f8a;
    --sky-10: #fcfcfd;   --sky-30: #f7f8fa;   --sky-50: #f2f4f7;
    --sky-100: #e5e8ec;  --sky-200: #d1d6dc;  --sky-400: #9aa4b3;
    --sky-600: #5e6877;  --sky-800: #2f363f;  --sky-900: #1d2125;
    --green-50: #e8f3ee; --green-600: #146c43;
    --red-50: #fcebec;   --red-500: #dc3545;  --red-600: #b02a37;
    --amber-50: #fff7e6; --amber-600: #b45309;

    /* semânticos — é isto que o resto da folha usa */
    --page: var(--sky-30);
    --surface: var(--sky-10);
    --surface-soft: var(--sky-50);
    --surface-hover: var(--sky-100);
    --border: var(--sky-200);
    --text: var(--sky-900);
    --text-medium: var(--sky-600);
    --primary: var(--blue-500);
    --primary-hover: var(--blue-600);
    --primary-pressed: var(--blue-700);
    --primary-soft: var(--blue-50);
    --focus: var(--blue-400);

    /* espaçamento, raio, tipografia */
    --pad-xs: 8px;  --pad-sm: 12px; --pad-md: 16px;
    --pad-lg: 20px; --pad-xl: 24px; --pad-2xl: 32px;
    --radius-card: 24px;   /* container-md  — cards e painéis  */
    --radius-input: 12px;  /* composite-md  — inputs           */
    --radius-sm: 8px;
    --radius-pill: 999px;  /* botão do Atlas é pílula          */

    --font: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  /*
   * Modo escuro: o Asaas é um produto claro, mas o painel vive no monitor de um dev
   * às 23h. Aqui só os tokens semânticos são reatribuídos — o azul da marca e toda a
   * geometria (raios, paddings, pílulas) seguem idênticos, então continua sendo Atlas.
   */
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #14181d;
      --surface: #1a1f26;
      --surface-soft: #20262e;
      --surface-hover: #262d36;
      --border: #313a45;
      --text: #eef1f4;
      --text-medium: #9aa4b3;
      --primary: #3d6dff;
      --primary-hover: #5680ff;
      --primary-pressed: #1f61ff;
      --primary-soft: #1b2a52;
      --green-50: #14301f;  --green-600: #4ade80;
      --red-50: #3a1d20;    --red-500: #f26d78;  --red-600: #f26d78;
      --amber-50: #3a2c12;  --amber-600: #f0b849;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--page);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    line-height: 150%;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--primary); }

  /* O Atlas reduz a escala tipográfica inteira num degrau abaixo de 992px. */
  @media (max-width: 992px) { body { font-size: 14px; } }

  /* Foco do Atlas é OUTLINE, nunca box-shadow. */
  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .wrap { max-width: 1240px; margin: 0 auto; padding: var(--pad-xl) var(--pad-md) 64px; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* ── barra do relógio ─────────────────────────────────────── */
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: var(--pad-sm) var(--pad-md);
  }
  .hdr {
    max-width: 1240px; margin: 0 auto;
    display: flex; gap: var(--pad-md); align-items: center; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .brand svg { flex: none; }
  .brand small {
    color: var(--text-medium); font-weight: 400; font-size: 14px;
    padding-left: 10px; margin-left: 2px; border-left: 1px solid var(--border);
  }
  .clock { margin-left: auto; display: flex; gap: var(--pad-xs); align-items: center; flex-wrap: wrap; }
  .today {
    font-family: var(--mono); font-size: 14px; line-height: 100%;
    padding: 9px var(--pad-sm);
    background: var(--surface-soft); border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .today b { color: var(--primary); font-weight: 500; }

  /* ── botões (pílula, como no Atlas) ───────────────────────── */
  button {
    font-family: var(--font); font-size: 14px; font-weight: 500; line-height: 100%;
    cursor: pointer; color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 11px var(--pad-md);
    transition: background-color .12s ease, border-color .12s ease;
  }
  button:hover:not(:disabled) { background: var(--surface-hover); }
  button:active:not(:disabled) { background: var(--surface-soft); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  button.primary {
    background: var(--primary); border-color: var(--primary); color: #fff;
  }
  button.primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
  button.primary:active:not(:disabled) { background: var(--primary-pressed); border-color: var(--primary-pressed); }

  button.ghost {
    background: none; border-color: transparent; color: var(--primary);
    padding: 4px var(--pad-xs); font-size: 12px;
  }
  button.ghost:hover:not(:disabled) { background: var(--primary-soft); }

  /* ── cartões ──────────────────────────────────────────────── */
  .grid {
    display: grid; gap: var(--pad-md);
    grid-template-columns: 360px 1fr; align-items: start;
  }
  @media (max-width: 992px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    overflow: hidden;
  }
  .card > h2 {
    margin: 0; padding: var(--pad-md) var(--pad-lg);
    font-size: 16px; font-weight: 500; line-height: 130%;  /* heading-6 do Atlas */
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: var(--pad-xs);
  }
  .card > h2 .count {
    margin-left: auto; font-size: 12px; font-weight: 500; color: var(--text-medium);
    background: var(--surface-soft); border-radius: var(--radius-pill);
    padding: 2px var(--pad-xs); min-width: 22px; text-align: center;
  }
  .body { padding: var(--pad-lg); }

  /* ── contas ───────────────────────────────────────────────── */
  .acct {
    padding: var(--pad-sm) var(--pad-lg);
    border: 0; border-bottom: 1px solid var(--border);
    border-radius: 0; background: none;
    cursor: pointer; display: block; width: 100%; text-align: left;
    box-shadow: inset 3px 0 0 transparent;
  }
  .acct:last-child { border-bottom: 0; }
  .acct:hover { background: var(--surface-hover); }
  .acct[aria-current="true"] {
    background: var(--primary-soft);
    box-shadow: inset 3px 0 0 var(--primary);
  }
  .acct .top { display: flex; align-items: center; gap: var(--pad-xs); }
  .acct .nm { font-weight: 500; font-size: 14px; }
  .acct .bal {
    margin-left: auto; font-family: var(--mono); font-size: 14px; font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .acct .bal.neg { color: var(--red-600); }
  .acct .sub {
    color: var(--text-medium); font-size: 12px; font-family: var(--mono);
    margin-top: 3px;
  }

  .tag {
    font-size: 11px; font-weight: 500; line-height: 100%;
    padding: 4px var(--pad-xs); border-radius: var(--radius-pill);
    background: var(--surface-soft); color: var(--text-medium);
  }
  .tag.main { background: var(--primary-soft); color: var(--primary); }

  /* ── detalhe ──────────────────────────────────────────────── */
  .kv {
    display: grid; grid-template-columns: 120px 1fr;
    gap: var(--pad-sm) var(--pad-md); font-size: 14px; margin: 0;
  }
  .kv dt { color: var(--text-medium); }
  .kv dd {
    margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums;
    word-break: break-all; display: flex; gap: 6px; align-items: center;
  }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    text-align: left; color: var(--text-medium); font-weight: 500; font-size: 12px;
    padding: var(--pad-xs) var(--pad-md);
    background: var(--surface-soft);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td {
    padding: var(--pad-sm) var(--pad-md); border-bottom: 1px solid var(--border);
    font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--surface-soft); }
  /* Alinha a coluna de borda com o padding do card — sem isto a tabela "vaza"
     4px para dentro da margem e o título do cartão não bate com a 1ª célula. */
  th:first-child, td:first-child { padding-left: var(--pad-lg); }
  th:last-child, td:last-child { padding-right: var(--pad-lg); }
  td.num { text-align: right; }
  td.pos { color: var(--green-600); }
  td.neg { color: var(--red-600); }

  /* Status: no Atlas o estado é um chip de fundo suave, não texto colorido. */
  .st {
    font-size: 11px; font-weight: 500; line-height: 100%; font-family: var(--font);
    padding: 4px var(--pad-xs); border-radius: var(--radius-pill);
    background: var(--surface-soft); color: var(--text-medium);
    display: inline-block;
  }
  .st-CONFIRMED, .st-AWAITING_CREDIT, .st-PENDING_ANTICIPATION {
    background: var(--amber-50); color: var(--amber-600);
  }
  .st-RECEIVED, .st-RECEIVED_IN_CASH, .st-DONE, .st-SUCCESS, .st-CONFIRMED_ANTICIPATION {
    background: var(--green-50); color: var(--green-600);
  }
  .st-OVERDUE, .st-FAILED, .st-REFUNDED, .st-CANCELLED, .st-BLOCKED_BY_VALUE_DIVERGENCE {
    background: var(--red-50); color: var(--red-600);
  }

  .empty {
    padding: var(--pad-2xl) var(--pad-lg); color: var(--text-medium);
    text-align: center; font-size: 14px; line-height: 150%;
  }
  .empty code {
    font-family: var(--mono); font-size: 13px;
    background: var(--surface-soft); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 2px 6px;
  }

  /* ── formulário ───────────────────────────────────────────── */
  form.new { display: grid; gap: var(--pad-sm); }
  label.field { display: grid; gap: 6px; }
  label.field > span { font-size: 12px; font-weight: 500; color: var(--text-medium); }

  input, select {
    font-family: var(--font); font-size: 14px; width: 100%;
    height: 40px; padding: var(--pad-xs) var(--pad-sm);
    color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-input);
  }
  input::placeholder { color: var(--text-medium); }
  input:hover:not(:focus) { border-color: var(--sky-400); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--pad-sm); }
  form.new button[type="submit"] { margin-top: var(--pad-xs); width: 100%; }

  .err {
    color: var(--red-600); background: var(--red-50);
    border-radius: var(--radius-input); padding: var(--pad-sm);
    font-size: 13px; margin-top: var(--pad-sm);
  }

  /* Abas: controle segmentado, o mesmo formato de pílula dos botões. */
  .tabs {
    display: inline-flex; gap: 2px; padding: 3px;
    background: var(--surface-soft); border: 1px solid var(--border);
    border-radius: var(--radius-pill);
  }
  .tabs button {
    border: 0; background: none; padding: 7px var(--pad-sm);
    font-size: 13px; color: var(--text-medium);
  }
  .tabs button:hover { background: transparent; color: var(--text); }
  .tabs button[aria-selected="true"] {
    background: var(--surface); color: var(--text);
    box-shadow: 0 1px 2px rgb(29 33 37 / 8%);
  }

  .stack { display: grid; gap: var(--pad-md); }
  .hint {
    color: var(--text-medium); font-size: 13px; line-height: 150%;
    margin: var(--pad-md) 0 0;
  }
  .hint b { color: var(--text); font-weight: 500; }
</style>
</head>
<body>

<header>
  <div class="hdr">
    <div class="brand">
      <!-- Marca geométrica no azul do Asaas. Não é o logotipo oficial de
           propósito: isto é um simulador, e não deve se passar pelo produto. -->
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
        <rect width="26" height="26" rx="8" fill="var(--primary)" />
        <path d="M7 17.5c0-4 2.5-9 6-9s6 5 6 9" stroke="#fff" stroke-width="2.4"
              stroke-linecap="round" fill="none" />
        <circle cx="13" cy="13.5" r="1.8" fill="#fff" />
      </svg>
      Asaas Mock <small>painel</small>
    </div>
    <div class="clock">
      <span class="today" id="clock">…</span>
      <button data-adv="1">+1 dia</button>
      <button data-adv="7">+7</button>
      <button data-adv="32" title="D+32: o dia em que o cartão credita">+32</button>
      <button id="tick" title="Roda os jobs sem mexer no relógio">tick</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="grid">

    <div class="stack">
      <section class="card">
        <h2>Contas <span class="count" id="acct-count"></span></h2>
        <div id="accounts"><div class="empty">carregando…</div></div>
      </section>

      <section class="card">
        <h2>Nova subconta</h2>
        <div class="body">
          <form class="new" id="new-sub">
            <label class="field">
              <span>Nome</span>
              <input name="name" placeholder="Loja do João" required />
            </label>
            <div class="row2">
              <label class="field">
                <span>CPF/CNPJ</span>
                <input name="cpfCnpj" placeholder="000.000.000-00" required />
              </label>
              <label class="field">
                <span>Celular</span>
                <input name="mobilePhone" value="47996321478" />
              </label>
            </div>
            <label class="field">
              <span>E-mail</span>
              <input name="email" type="email" placeholder="joao@exemplo.com" required />
            </label>
            <div class="row2">
              <label class="field">
                <span>CEP</span>
                <input name="postalCode" value="14079-452" />
              </label>
              <label class="field">
                <span>Faturamento</span>
                <input name="incomeValue" type="number" value="25000" />
              </label>
            </div>
            <button class="primary" type="submit">Criar subconta</button>
          </form>
          <div class="err" id="new-sub-err" hidden></div>
          <p class="hint">
            A subconta nasce com <b>walletId</b> e <b>chave de API próprios</b>. É o que
            faz o split mover dinheiro de verdade: sem duas contas autenticáveis, o
            walletId de destino seria uma string sem dono.
          </p>
        </div>
      </section>
    </div>

    <div class="stack" id="detail">
      <div class="card"><div class="empty">selecione uma conta</div></div>
    </div>

  </div>

  <section class="card" id="cards" style="margin-top: var(--pad-md)">
    <h2>Cartões de teste</h2>
    <div id="cards-body"><div class="empty">carregando…</div></div>
  </section>
</div>

<script type="module">
const $ = (s, r = document) => r.querySelector(s)
const money = (v) =>
  (v ?? 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })

/** Estado da tela. Pequeno o bastante para não precisar de framework. */
const state = { accounts: [], selected: null, tab: 'payments', detail: {} }

// ── HTTP ────────────────────────────────────────────────────────────────────
async function admin(path, opts) {
  const r = await fetch('/_admin' + path, {
    headers: { 'content-type': 'application/json' },
    ...opts,
  })
  const b = await r.json().catch(() => null)
  if (!r.ok) throw new Error(b?.errors?.[0]?.description ?? `HTTP ${r.status}`)
  return b
}

/**
 * Chama a API v3 do Asaas COMO a conta selecionada.
 *
 * É o ponto do painel: cada conta tem a sua chave, e olhar o simulador pelos
 * olhos de uma subconta é a única forma de ver que ela é de fato isolada — ela
 * não enxerga as cobranças do pai.
 */
async function v3(path, key, opts) {
  const r = await fetch('/v3' + path, {
    headers: { access_token: key, 'content-type': 'application/json' },
    ...opts,
  })
  const b = await r.json().catch(() => null)
  if (!r.ok) throw new Error(b?.errors?.[0]?.description ?? `HTTP ${r.status}`)
  return b
}

// ── relógio ─────────────────────────────────────────────────────────────────
async function loadClock() {
  const c = await admin('/clock')
  const virtual = c.mode !== 'REAL'
  $('#clock').innerHTML =
    `<b>${c.today}</b> · ${c.mode}` +
    (virtual ? '' : ' <span title="Suba com CLOCK_MODE=VIRTUAL_FROZEN para viajar no tempo">⚠</span>')

  // Sem relógio virtual não há viagem no tempo — e o botão que não funciona
  // deve DIZER que não funciona, não falhar quando clicado.
  for (const b of document.querySelectorAll('[data-adv]')) {
    b.disabled = !virtual
    b.title = virtual
      ? b.title
      : 'O relógio está em modo REAL. Suba com CLOCK_MODE=VIRTUAL_FROZEN.'
  }
}

async function advance(days) {
  const btns = [...document.querySelectorAll('header button')]
  btns.forEach((b) => (b.disabled = true))
  try {
    await admin('/clock/advance', { method: 'POST', body: JSON.stringify({ days }) })
    await refresh()
  } catch (e) {
    alert(e.message)
  } finally {
    btns.forEach((b) => (b.disabled = false))
    await loadClock()
  }
}

// ── contas ──────────────────────────────────────────────────────────────────
async function loadAccounts() {
  const { accounts } = await admin('/accounts')
  state.accounts = accounts
  if (!state.selected || !accounts.some((a) => a.id === state.selected)) {
    state.selected = accounts.find((a) => !a.parentAccountId)?.id ?? accounts[0]?.id
  }
  renderAccounts()
}

function renderAccounts() {
  const el = $('#accounts')
  $('#acct-count').textContent = state.accounts.length

  el.innerHTML = state.accounts
    .map((a) => {
      const main = !a.parentAccountId
      return `
      <button class="acct" data-id="${a.id}" aria-current="${a.id === state.selected}">
        <div class="top">
          <span class="nm">${esc(a.name)}</span>
          <span class="tag ${main ? 'main' : ''}">${main ? 'principal' : 'subconta'}</span>
          <span class="bal ${a.balance < 0 ? 'neg' : ''}">${money(a.balance)}</span>
        </div>
        <div class="sub">${a.walletId.slice(0, 8)}… · ${esc(a.email)}</div>
      </button>`
    })
    .join('')

  for (const b of el.querySelectorAll('.acct')) {
    b.onclick = () => {
      state.selected = b.dataset.id
      renderAccounts()
      loadDetail()
    }
  }
}

// ── detalhe da conta ────────────────────────────────────────────────────────
async function loadDetail() {
  const a = state.accounts.find((x) => x.id === state.selected)
  if (!a) return

  renderDetail(a, null)
  try {
    const [payments, extract] = await Promise.all([
      v3('/payments?limit=15', a.apiKey),
      v3('/financialTransactions?limit=15', a.apiKey).catch(() => ({ data: [] })),
    ])
    state.detail = { payments: payments.data ?? [], extract: extract.data ?? [] }
  } catch (e) {
    state.detail = { error: e.message }
  }
  renderDetail(a, state.detail)
}

function renderDetail(a, d) {
  const rows =
    state.tab === 'payments'
      ? paymentRows(d?.payments)
      : extractRows(d?.extract)

  $('#detail').innerHTML = `
    <section class="card">
      <h2>${esc(a.name)}</h2>
      <div class="body">
        <dl class="kv">
          <dt>Saldo</dt><dd><b>${money(a.balance)}</b></dd>
          <dt>walletId</dt><dd>${a.walletId} ${copyBtn(a.walletId)}</dd>
          <dt>Chave de API</dt><dd>${mask(a.apiKey)} ${copyBtn(a.apiKey)}</dd>
          <dt>accountId</dt><dd>${a.id}</dd>
          <dt>CPF/CNPJ</dt><dd>${a.cpfCnpj ?? '—'}</dd>
        </dl>
      </div>
    </section>

    <section class="card">
      <h2>
        <span class="tabs">
          <button data-tab="payments" aria-selected="${state.tab === 'payments'}">Cobranças</button>
          <button data-tab="extract"  aria-selected="${state.tab === 'extract'}">Extrato</button>
        </span>
      </h2>
      ${d?.error ? `<div class="empty">${esc(d.error)}</div>` : rows}
    </section>`

  for (const b of $('#detail').querySelectorAll('[data-tab]')) {
    b.onclick = () => {
      state.tab = b.dataset.tab
      renderDetail(a, state.detail)
    }
  }
  for (const b of $('#detail').querySelectorAll('[data-copy]')) {
    b.onclick = () => {
      navigator.clipboard.writeText(b.dataset.copy)
      b.textContent = 'copiado'
      setTimeout(() => (b.textContent = 'copiar'), 1200)
    }
  }
}

function paymentRows(list) {
  if (!list) return `<div class="empty">carregando…</div>`
  if (!list.length) {
    return `<div class="empty">
      Nenhuma cobrança nesta conta.<br />
      <code>POST /v3/payments</code> com a chave acima.
    </div>`
  }
  return `<table>
    <thead><tr>
      <th>Cobrança</th><th>Tipo</th><th>Status</th>
      <th>Vence</th><th>Crédito</th>
      <th class="num">Valor</th><th class="num">Líquido</th>
    </tr></thead>
    <tbody>${list
      .map(
        (p) => `<tr>
        <td>${p.id}</td>
        <td>${p.billingType}</td>
        <td><span class="st st-${p.status}">${p.status}</span></td>
        <td>${p.dueDate}</td>
        <td>${p.creditDate ?? '—'}</td>
        <td class="num">${money(p.value)}</td>
        <td class="num">${money(p.netValue)}</td>
      </tr>`,
      )
      .join('')}</tbody>
  </table>`
}

function extractRows(list) {
  if (!list) return `<div class="empty">carregando…</div>`
  if (!list.length) {
    return `<div class="empty">
      Extrato vazio. O saldo só se move por lançamento —
      cobre uma cobrança e avance o relógio.
    </div>`
  }
  return `<table>
    <thead><tr>
      <th>Data</th><th>Tipo</th><th>Descrição</th>
      <th class="num">Valor</th><th class="num">Saldo</th>
    </tr></thead>
    <tbody>${list
      .map(
        (t) => `<tr>
        <td>${t.date ?? '—'}</td>
        <td>${t.type}</td>
        <td style="white-space:normal">${esc(t.description ?? '')}</td>
        <td class="num ${t.value < 0 ? 'neg' : 'pos'}">${money(t.value)}</td>
        <td class="num">${money(t.balance)}</td>
      </tr>`,
      )
      .join('')}</tbody>
  </table>`
}

// ── criar subconta ──────────────────────────────────────────────────────────
$('#new-sub').onsubmit = async (ev) => {
  ev.preventDefault()
  const form = ev.target
  const err = $('#new-sub-err')
  err.hidden = true

  // A subconta é criada COM A CHAVE DA CONTA PRINCIPAL — é ela a mãe.
  const parent = state.accounts.find((a) => !a.parentAccountId)
  const f = Object.fromEntries(new FormData(form))

  form.querySelector('button').disabled = true
  try {
    await v3('/accounts', parent.apiKey, {
      method: 'POST',
      body: JSON.stringify({
        name: f.name,
        email: f.email,
        cpfCnpj: f.cpfCnpj,
        mobilePhone: f.mobilePhone,
        incomeValue: Number(f.incomeValue),
        address: 'Rua Exemplo',
        addressNumber: '100',
        province: 'Centro',
        postalCode: f.postalCode,
      }),
    })
    form.reset()
    await loadAccounts()
  } catch (e) {
    err.textContent = e.message
    err.hidden = false
  } finally {
    form.querySelector('button').disabled = false
  }
}

// ── cartões de teste ────────────────────────────────────────────────────────
/**
 * A tabela vem do SERVIDOR (`/_admin/test-cards`), que a lê do domínio — a mesma
 * constante que decide o desfecho de verdade. Não há cópia aqui: uma tela que
 * mantivesse a sua própria lista acabaria anunciando um cartão que o servidor
 * não honra, com botão de copiar e tudo.
 */
async function loadCards() {
  const { cards, triggers } = await admin('/test-cards')

  const row = (c) => `
    <tr>
      <td>${fmtPan(c.number)} ${copyBtn(c.number)}</td>
      <td>${c.brand}</td>
      <td>
        <span class="st ${c.outcome === 'APPROVE' ? 'st-RECEIVED' : 'st-OVERDUE'}">
          ${esc(c.label)}
        </span>
      </td>
      <td>${c.error ? `<code>${esc(c.error.code)}</code>` : '—'}</td>
      <td style="white-space:normal">${c.error ? esc(c.error.description) : '—'}</td>
      <td>${
        c.real
          ? '<span class="tag main">Asaas real</span>'
          : '<span class="tag" title="No Asaas de verdade este número seria APROVADO. Só existe aqui.">simulação</span>'
      }</td>
    </tr>`

  $('#cards-body').innerHTML = `
    <table>
      <thead><tr>
        <th>Número</th><th>Bandeira</th><th>Resultado</th>
        <th>code</th><th>Mensagem</th><th>Fidelidade</th>
      </tr></thead>
      <tbody>${cards.map(row).join('')}</tbody>
    </table>

    <div class="body" style="border-top:1px solid var(--border)">
      <p class="hint" style="margin:0 0 var(--pad-sm)">
        <b>Qualquer número bem-formado aprova</b> — o Asaas não valida Luhn, e nós
        também não (foi capturado do sandbox: <code>4111111111111112</code> aprova lá).
        Os erros abaixo <b>não se disparam por número</b>: são propriedades de outros
        campos, e é assim que o Asaas os produz.
      </p>
      <table>
        <thead><tr><th>Erro</th><th>Como disparar</th><th>Mensagem</th></tr></thead>
        <tbody>${triggers
          .map(
            (t) => `<tr>
              <td>${esc(t.label)}</td>
              <td><code>${esc(t.how)}</code></td>
              <td style="white-space:normal">${esc(t.error.description)}</td>
            </tr>`,
          )
          .join('')}</tbody>
      </table>
    </div>`

  for (const b of $('#cards').querySelectorAll('[data-copy]')) {
    b.onclick = () => {
      navigator.clipboard.writeText(b.dataset.copy)
      b.textContent = 'copiado'
      setTimeout(() => (b.textContent = 'copiar'), 1200)
    }
  }
}

/** `4444444444444444` → `4444 4444 4444 4444`. Só para a leitura humana. */
const fmtPan = (n) => esc(n).replace(/(.{4})/g, '$1 ').trim()

// ── util ────────────────────────────────────────────────────────────────────
const esc = (s) =>
  String(s ?? '').replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c],
  )
const mask = (k) => (k ? esc(k.slice(0, 22)) + '…' : '—')
const copyBtn = (v) => `<button class="ghost" data-copy="${esc(v)}">copiar</button>`

async function refresh() {
  await loadAccounts()
  await loadDetail()
}

for (const b of document.querySelectorAll('[data-adv]')) {
  b.onclick = () => advance(Number(b.dataset.adv))
}
$('#tick').onclick = async () => {
  await admin('/tick', { method: 'POST' })
  await refresh()
}

await loadClock()
await refresh()
await loadCards()
</script>
</body>
</html>
